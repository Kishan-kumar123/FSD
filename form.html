<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sample Registration Form</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#22c55e; --error:#ef4444; }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial;
      background:linear-gradient(135deg,#0b1022 0%, #111827 60%, #0b1022 100%); color:var(--text);
      min-height:100dvh; display:grid; place-items:center; padding:24px;
    }
    .card{
      width:min(720px,100%); background:rgba(17,24,39,.85); backdrop-filter: blur(6px);
      border:1px solid rgba(255,255,255,.06); border-radius:18px; padding:22px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    h1{margin:6px 0 18px; font-size:1.5rem; letter-spacing:.2px}
    p.hint{margin:0 0 18px; color:var(--muted); font-size:.95rem}
    form{display:grid; gap:14px}
    .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
    @media (max-width:640px){ .grid{grid-template-columns:1fr} }
    label{display:block; font-size:.9rem; margin:0 0 6px; color:#cbd5e1}
    input, select, textarea{
      width:100%; padding:11px 12px; border:1px solid #334155; background:#0b1220; color:var(--text);
      border-radius:10px; outline:none; transition:border .18s, box-shadow .18s;
    }
    input:focus, select:focus, textarea:focus{ border-color:#4f46e5; box-shadow:0 0 0 3px rgba(79,70,229,.25) }
    .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
    .row .checkwrap{display:flex; align-items:center; gap:8px}
    .req{color:var(--accent)}
    .actions{display:flex; gap:12px; justify-content:flex-end; margin-top:8px}
    button{
      padding:11px 16px; border:0; border-radius:12px; cursor:pointer; font-weight:600;
      background:var(--accent); color:#052e16;
    }
    button.secondary{background:#1f2937; color:#e5e7eb; border:1px solid #374151}
    small.note{color:var(--muted); display:block; margin-top:6px}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Registration Form</h1>
    <p class="hint">Fields marked with <span class="req">*</span> are required.</p>

    <form action="#" method="post" novalidate>
      <div class="grid">
        <div>
          <label for="firstName">First Name <span class="req">*</span></label>
          <input id="firstName" name="firstName" type="text" required minlength="2" autocomplete="given-name" />
        </div>
        <div>
          <label for="lastName">Last Name <span class="req">*</span></label>
          <input id="lastName" name="lastName" type="text" required minlength="2" autocomplete="family-name" />
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="email">Email <span class="req">*</span></label>
          <input id="email" name="email" type="email" required placeholder="you@example.com" autocomplete="email" />
        </div>
        <div>
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="+91 98765 43210"
                 pattern="^\+?[0-9][0-9\s\-()]{7,}$" autocomplete="tel" />
          <small class="note">Use digits, spaces, or dashes.</small>
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="password">Password <span class="req">*</span></label>
          <input id="password" name="password" type="password" required minlength="8"
                 placeholder="At least 8 characters" autocomplete="new-password" />
        </div>
        <div>
          <label for="dob">Date of Birth</label>
          <input id="dob" name="dob" type="date" />
        </div>
      </div>

      <div>
        <label>Gender</label>
        <div class="row" role="group" aria-labelledby="gender">
          <label class="checkwrap"><input type="radio" name="gender" value="female" /> Female</label>
          <label class="checkwrap"><input type="radio" name="gender" value="male" /> Male</label>
          <label class="checkwrap"><input type="radio" name="gender" value="other" /> Other</label>
          <label class="checkwrap"><input type="radio" name="gender" value="prefer_not" /> Prefer not to say</label>
        </div>
      </div>

      <div>
        <label for="country">Country <span class="req">*</span></label>
        <select id="country" name="country" required>
          <option value="" selected disabled>Choose a country</option>
          <option>India</option>
          <option>United States</option>
          <option>United Kingdom</option>
          <option>Canada</option>
          <option>Australia</option>
          <option>Other</option>
        </select>
      </div>

      <div>
        <label>Interests</label>
        <div class="row">
          <label class="checkwrap"><input type="checkbox" name="interests" value="coding" /> Coding</label>
          <label class="checkwrap"><input type="checkbox" name="interests" value="music" /> Music</label>
          <label class="checkwrap"><input type="checkbox" name="interests" value="sports" /> Sports</label>
          <label class="checkwrap"><input type="checkbox" name="interests" value="travel" /> Travel</label>
        </div>
      </div>

      <div>
        <label for="about">About You</label>
        <textarea id="about" name="about" rows="4" placeholder="Tell us a little about yourself..."></textarea>
      </div>

      <div class="row">
        <label class="checkwrap">
          <input type="checkbox" name="terms" required />
          I agree to the Terms and Privacy Policy <span class="req">*</span>
        </label>
      </div>

      <div class="actions">
        <button type="reset" class="secondary">Reset</button>
        <button type="submit">Submit</button>
      </div>
    </form>
  </main>
</body>
</html>
